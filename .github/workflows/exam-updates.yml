name: Weekly exam update review

on:
  schedule:
    - cron: '23 18 * * 6' # Sunday 03:23 JST (UTC+9)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-exam-update-review
  cancel-in-progress: false

jobs:
  request-review:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Request official-source review from Copilot
        run: node --experimental-strip-types scripts/request-exam-review.mjs
        env:
          COPILOT_ASSIGNMENT_TOKEN: ${{ secrets.COPILOT_ASSIGNMENT_TOKEN }}
